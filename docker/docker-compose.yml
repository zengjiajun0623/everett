# Everett devnet stack: node + stratum sidecar for GPU miners.
# Works with `docker compose up -d --build` and with Portainer stacks
# (custom-paste and git-repo modes) - see docker/README.md for the GUI
# walkthrough and the environment variable table.
#
# Default: DEVNET (genesis-dev.json, chain ID 15537391, --nodiscover,
# throwaway etherbase, zero CPU mining threads), with KawPow selected
# (EVERETT_KAWPOW=1) so the stratum sidecar + a KawPow miner work end to
# end, the same PoW Wheeler and mainnet run. 15537393 is RESERVED for
# mainnet; the legacy genesis-devnet.json still carries it and ships only
# for compatibility with stacks already running it (pre-flip builds).
#
# For Wheeler (testnet, chain ID 15537392) set:
#   GENESIS:   genesis-wheeler.json
#   BOOTNODE:  enode://...@host:30303
# and publish 30303 if you want inbound peers (uncomment below).

name: everett

services:
  node:
    image: everett-node:local
    build:
      context: ..
      dockerfile: docker/node.Dockerfile
    container_name: everett-node
    environment:
      # genesis-dev.json | genesis-wheeler.json | genesis.json (reserved)
      # | genesis-devnet.json (legacy, reserved mainnet chain ID)
      GENESIS: genesis-dev.json
      MINE: "1"
      # Throwaway devnet address; replace with your own EOA to keep coins.
      ETHERBASE: "0x1000000000000000000000000000000000000001"
      # 0 = serve work only (the entrypoint passes -1 to geth, which is
      # what actually disables local mining; plain 0 means all cores).
      MINER_THREADS: "0"
      # KawPow on the dev chain (Wheeler/mainnet are KawPow regardless).
      # Unset this only to run a legacy ethash devnet with the miner
      # service below (profile ethash-legacy).
      EVERETT_KAWPOW: "1"
      # NETWORKID: 15537391   # auto-derived from GENESIS when unset
      # BOOTNODE: ""          # set for Wheeler; --nodiscover when unset
    ports:
      # RPC: localhost only on the host. Never publish to 0.0.0.0.
      - "127.0.0.1:8545:8545"
      # Optional: P2P inbound (needed for Wheeler). Enable with 0.0.0.0 for
      # public peers; keep 127.0.0.1 for a private node.
      # - "127.0.0.1:30303:30303/tcp"
      # - "127.0.0.1:30303:30303/udp"
    volumes:
      - /opt/docker/everett-node:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-X", "POST", "-H", "Content-Type: application/json",
             "--data", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}",
             "http://127.0.0.1:8545"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  stratum:
    image: everett-stratum:local
    build:
      context: ..
      dockerfile: docker/stratum.Dockerfile
    container_name: everett-stratum
    depends_on:
      node:
        condition: service_healthy
    command: ["-node", "http://node:8545", "-listen", "0.0.0.0:3333"]
    ports:
      # Stratum for KawPow miners (kawpowminer/T-Rex). LAN-wide by
      # default so GPUs on other machines can mine to your node:
      #   kawpowminer -U -P stratum+tcp://worker@<host>:3333
      # (the +tcp matters: it forces the mode-0 dialect, stratum/README.md)
      # Payouts go to the NODE's ETHERBASE above; the stratum username is
      # logging only and never reaches the chain.
      - "3333:3333"
    restart: unless-stopped

  # NOTE: the ethminer service below is ETHASH-ONLY (legacy devnet
  # plumbing). It cannot mine KawPow, and the default stack IS KawPow now,
  # so it stays behind a profile: it only starts with
  #   docker compose --profile ethash-legacy up  (plus EVERETT_KAWPOW unset)
  miner:
    profiles: ["ethash-legacy"]
    image: everett-miner:local
    build:
      context: ..
      dockerfile: docker/miner.Dockerfile
    container_name: everett-miner
    depends_on:
      node:
        condition: service_healthy
    # Work fetched from the node over RPC (eth_getWork/eth_submitWork).
    # --cuda-devices: "0" on a single-GPU host; "0 1" etc. for more.
    command: ["-U", "-P", "http://node:8545", "--cuda-devices", "0", "-v", "1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Persist the ethash cache across restarts.
      - /opt/docker/everett-miner:/root/.ethash
    restart: unless-stopped

# Private bridge shared by node and miner; nothing exposed on the host from
# the miner.
networks:
  default:
    name: everett-int
    driver: bridge
