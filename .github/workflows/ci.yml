name: everett-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  consensus-tests:
    name: consensus unit gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Cache core-geth build tree
        uses: actions/cache@v4
        with:
          path: build/core-geth
          key: core-geth-${{ hashFiles('scripts/ci_prepare.sh', 'scripts/apply_hook.py', 'scripts/apply_daa_hook.py', 'scripts/apply_kawpow_hooks.py') }}
      - name: Prepare patched core-geth
        run: scripts/ci_prepare.sh
      # gate_test.sh asserts the tests actually RAN: `go test -run X` exits 0
      # with "no tests to run" when the pattern matches nothing, so a test
      # file missing from the prep recipe would otherwise show up as a green
      # consensus gate.
      - name: Article III schedule vectors
        run: cd build/core-geth && bash ../../scripts/gate_test.sh ./params/mutations/ TestEverett 5
      - name: ASERT difficulty vectors (incl. sync-determinism regression)
        run: cd build/core-geth && bash ../../scripts/gate_test.sh ./consensus/ethash/ TestASERT 11
      - name: KawPow differential vectors (Ravencoin reference)
        run: cd build/core-geth && bash ../../scripts/gate_test.sh ./consensus/ethash/ TestKawPow 7 -timeout 40m

  constitution-consistency:
    name: constitution vs implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Article III parameters agree across constitution, spec, and code
        run: python3 scripts/check_consistency.py

  stratum-gates:
    name: stratum sidecar (vet + race tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Vet
        working-directory: stratum
        run: go vet ./...
      - name: Unit tests under the race detector
        working-directory: stratum
        run: go test -race ./...

  devnet-e2e:
    name: devnet end-to-end (mine + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Cache gate build tree
        uses: actions/cache@v4
        with:
          path: build/ci/core-geth
          key: ci-core-geth-${{ hashFiles('scripts/ci_prepare.sh', 'scripts/apply_hook.py', 'scripts/apply_daa_hook.py', 'scripts/apply_kawpow_hooks.py') }}
      - name: Boot devnet, mine, audit supply wei-exact
        # ci_devnet.sh preps its own isolated tree (COREGETH_DIR=build/ci/core-geth)
        # so a gate can never touch the tree a live operator node execs from.
        run: scripts/ci_devnet.sh

  formal-verification:
    name: "Article III machine-checked (Lean 4)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build proofs
        working-directory: fv
        run: lake build
      - name: Enforce zero sorries (lake treats sorry as a warning)
        # --include over the whole tree, NOT fv/*.lean: that glob stops at
        # the top level, so the first proof file placed in a subdirectory
        # could carry a sorry while this job still reported success.
        run: "! grep -rn --include='*.lean' 'sorry' fv/"
